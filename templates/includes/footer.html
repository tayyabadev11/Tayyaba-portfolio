<footer class="footer">
  <div class="footer-container">
    <div class="newsletter">
      <h4>Subscribe for Updates</h4>
      <p>Get notified whenever I add a new project.</p>
      {% if messages %}
        {% for message in messages %}
          <p class="newsletter-message">{{ message }}</p>
        {% endfor %}
      {% endif %}
      <form action="{% url 'subscribe' %}" method="POST" class="newsletter-form">
        {% csrf_token %}
        <input type="email" name="email" placeholder="Enter your email" required>
        <button type="submit">Subscribe</button>
      </form>
    </div>
    <div class="footer-links">
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'about' %}">About</a>
      <a href="{% url 'skills' %}">Skills</a>
      <a href="{% url 'services' %}">Services</a>
      <a href="{% url 'projects' %}">Projects</a>
      <a href="{% url 'contact' %}">Contact</a>
    </div>
    <div class="socials">
      <a href="https://github.com/tayyabadev11" target="_blank">GitHub</a>
    </div>
    <p>&copy; 2026 Tayyaba Zafar. All Rights Reserved.</p>
  </div>
</footer>
